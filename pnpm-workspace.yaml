packages:
  - fixtures/*
  - tests/e2e/*
  - playground

allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  cpu-features: false
  deasync: false
  esbuild: false
  lefthook: true
  protobufjs: false
  ssh2: false
  workerd: false

catalogs:
  default:
    drizzle-kit: ^0.31.10
    drizzle-orm: ^0.45.2
    h3: ^1.15.11
    nitro: 3.0.260610-beta
    nitropack: ^2.13.4
    tsdown: ^0.22.0
    wrangler: ^4.118.0
  drivers:
    "@cloudflare/workers-types": ^5.20260804.1
    "@electric-sql/pglite": ^0.5.4
    better-sqlite3: ^12.11.1
    mysql2: ^3.23.2
    postgres: ^3.4.9
  testcontainers:
    "@testcontainers/mysql": ^12.1.0
    "@testcontainers/postgresql": ^12.1.0
    testcontainers: ^12.1.0

minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - undici@7.29.0
